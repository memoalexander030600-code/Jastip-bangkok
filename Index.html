<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JASTIP BANGKOK</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #ffdce9;
  color: #33252b;
}

.container {
  max-width: 520px;
  margin: auto;
  background: #fff8fb;
  border: 3px solid #222;
  border-radius: 28px;
  padding: 25px;
  box-shadow: 8px 8px 0 #222;
}

h1 {
  text-align: center;
  margin: 5px 0;
  font-size: 32px;
}

.subtitle {
  text-align: center;
  font-weight: bold;
  margin-bottom: 25px;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 15px;
  margin-bottom: 7px;
}

input,
textarea {
  width: 100%;
  padding: 13px;
  border: 2px solid #222;
  border-radius: 13px;
  font-size: 16px;
  background: white;
}

textarea {
  min-height: 90px;
}

button {
  width: 100%;
  margin-top: 25px;
  padding: 16px;
  border: 3px solid #222;
  border-radius: 16px;
  background: #ff78a8;
  font-size: 18px;
  font-weight: bold;
  box-shadow: 4px 4px 0 #222;
  cursor: pointer;
}

button:active {
  transform: translate(3px, 3px);
  box-shadow: 1px 1px 0 #222;
}

.note {
  text-align: center;
  font-size: 13px;
  margin-top: 18px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎀 JASTIP BANGKOK 🎀</h1>

<div class="subtitle">
OPEN PO • 3–10 NOVEMBER
</div>

<form id="jastipForm">

<label>Nama</label>
<input type="text" id="nama" placeholder="Nama kamu" required>

<label>No. WhatsApp</label>
<input type="tel" id="wa" placeholder="08xxxxxxxxxx" required>

<label>Nama Barang</label>
<input type="text" id="barang" placeholder="Contoh: Tas, skincare, snack" required>
  

<label>Jumlah</label>
<input type="number" id="jumlah" value="1" min="1" required>

<label>Warna / Ukuran / Varian</label>
<input type="text" id="varian" placeholder="Contoh: Pink / Size M">

<label>Perkiraan Harga</label>
<input type="text" id="harga" placeholder="Contoh: Rp150.000">

<label>Catatan</label>
<textarea id="catatan" placeholder="Catatan tambahan..."></textarea>

<button type="submit">
💗 KIRIM PESANAN VIA WHATSAPP
</button>

</form>

<div class="note">
Pesanan akan dikirim langsung ke WhatsApp admin.
</div>

</div>

<script>

document.getElementById("jastipForm").addEventListener("submit", function(e) {

e.preventDefault();

const nomorAdmin = "6281348878772";

const pesan = `
🎀 *ORDER JASTIP BANGKOK* 🎀

👤 *Nama:* ${document.getElementById("nama").value}

📱 *WhatsApp:* ${document.getElementById("wa").value}

🛍️ *Barang:* ${document.getElementById("barang").value}

🔢 *Jumlah:* ${document.getElementById("jumlah").value}

🎨 *Varian:* ${document.getElementById("varian").value || "-"}

💰 *Perkiraan Harga:* ${document.getElementById("harga").value || "-"}

📝 *Catatan:* ${document.getElementById("catatan").value || "-"}

Mohon dibantu cek dan konfirmasi ya 🙏
`;

const url =
"https://wa.me/" +
nomorAdmin +
"?text=" +
encodeURIComponent(pesan);

window.open(url, "_blank");

});

</script>

</body>
</html>
